<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6주차 실습 1</title>
  <style>
    /*
    실습 1 · 기본

    문제: h1은 파란색 36px, class="intro"인 것은 굵은 글씨에 연노랑 배경, id="lead"인 것은 글자 20px가 되도록 CSS를 쓰세요.
    힌트: 태그는 그냥, 클래스는 앞에 점(.), 아이디는 앞에 샵(#)을 붙입니다.
    꼭 들어가야 하는 것: h1  .intro  #lead  color  font-weight  font-size
    */

</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>

  <button>버튼</button>

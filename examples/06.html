<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6주차 예제 6 · 누가 이길까?</title>
  <style>
    /*
    6주차 예제 6 — 누가 이길까?
    */
    p          { color: blue; }    /* 1점 */
    .note      { color: green; }   /* 10점 */
    p.note     { color: red; }     /* 1 + 10 = 11점  ← 이깁니다 */
    #lead      { color: black; }   /* 100점 ← 이게 걸리면 이게 이깁니다 */

    /* <p class="note" id="lead">이 글자는 무슨 색일까요?</p> → black */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>

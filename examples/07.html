<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6주차 예제 7 · ⚠ 실무에서 반복해 밟는 함정</title>
  <style>
    /*
    6주차 예제 7 — ⚠ 실무에서 반복해 밟는 함정
    */
    /* style.css 100번째 줄 */
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }     /* 모바일에서 1열 */
    }

    /* style.css 200번째 줄 */
    .grid { grid-template-columns: repeat(3, 1fr); }   /* ← 이게 이깁니다! */

    /* 결과: 휴대폰에서도 3열 그대로. "왜 안 접히지?"
       @media 안에 있다고 우선권이 있는 게 아닙니다.
       특정도가 같으면 나중에 온 쪽이 이깁니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>

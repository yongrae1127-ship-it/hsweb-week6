<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6주차 예제 1 · 세 가지 방법</title>
</head>
<body>
  <!--
  6주차 예제 1 — 세 가지 방법
  -->
  <!-- ① 인라인 — 태그에 직접. 급할 때만, 실무에서는 거의 안 씁니다 -->
  <p style="color: red;">빨간 글씨</p>

  <!-- ② 내부 스타일 — head 안의 <style>. 한 페이지짜리 연습용 -->
  <head>
    <style>
      p { color: red; }
    </style>
  </head>

  <!-- ③ 외부 스타일 — 별도 .css 파일 (실무 표준) -->
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6주차 예제 3 · 세 가지 기본 선택자</title>
  <style>
    /*
    6주차 예제 3 — 세 가지 기본 선택자
    */
    /* 태그 선택자 — 그 태그 전부 */
    p { color: #333; }

    /* 클래스 선택자 — class="note"인 것 전부. 점(.)으로 시작 */
    .note { background: #fef3c7; }

    /* 아이디 선택자 — id="lead" 하나. 샵(#)으로 시작 */
    #lead { font-size: 20px; }

    /* 전체 선택자 — 모든 요소 */
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>

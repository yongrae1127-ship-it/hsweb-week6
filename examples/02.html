<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6주차 예제 2 · CSS 문법 한 덩어리</title>
  <style>
    /*
    6주차 예제 2 — CSS 문법 한 덩어리
    */
    선택자 {
      속성: 값;
      속성: 값;
    }

    /* 실제 예 */
    h1 {
      color: #4338ca;    /* 속성: 값; — 세미콜론을 빠뜨리면 다음 줄까지 죽습니다 */
      font-size: 32px;
    }

    /* CSS 주석은 이 모양입니다. HTML 주석(<!-- -->)과 다릅니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>목록 1</li>
    <li>목록 2</li>
    <li>목록 3</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
